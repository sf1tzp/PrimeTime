<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
	<!-- Moment Tally tally-mark, from primetime-website/static/favicon.svg
	     (the flat no-glow simplification of brand/tally-motif-*.png),
	     composited onto the macOS icon grid: the tile occupies ~824/1024 of
	     the canvas with transparent margin, per the Big Sur+ icon template.
	     Keep the two files in sync if the mark changes. -->
	<rect x="100" y="100" width="824" height="824" rx="185.4" fill="#17151a" />
	<g transform="translate(208 208) scale(9.5)">
		<defs>
			<linearGradient id="bars" x1="0" y1="7" x2="0" y2="57" gradientUnits="userSpaceOnUse">
				<stop offset="0" stop-color="#ff9500" />
				<stop offset="0.45" stop-color="#ff2d55" />
				<stop offset="0.72" stop-color="#af52de" />
				<stop offset="1" stop-color="#4a5df0" />
			</linearGradient>
			<linearGradient id="strike" x1="3" y1="0" x2="61" y2="0" gradientUnits="userSpaceOnUse">
				<stop offset="0" stop-color="#007aff" />
				<stop offset="0.3" stop-color="#17b2e7" />
				<stop offset="0.6" stop-color="#29edd3" />
				<stop offset="1" stop-color="#2dff06" />
			</linearGradient>
		</defs>
		<!-- The dark-variant outline (#f2edf9): the tile is always dark. -->
		<g stroke="#f2edf9" stroke-width="1.5">
			<rect x="11.25" y="7" width="5.5" height="50" rx="2.75" fill="url(#bars)" />
			<rect x="23.25" y="7" width="5.5" height="50" rx="2.75" fill="url(#bars)" />
			<rect x="35.25" y="7" width="5.5" height="50" rx="2.75" fill="url(#bars)" />
			<rect x="47.25" y="7" width="5.5" height="50" rx="2.75" fill="url(#bars)" />
			<g transform="rotate(-27 32 32)">
				<rect x="3" y="29.25" width="58" height="5.5" rx="2.75" fill="url(#strike)" />
			</g>
		</g>
	</g>
</svg>
