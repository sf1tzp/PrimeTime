<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
	<!-- PrimeTime mark from primetime-website/static/favicon.svg, composited
	     onto the macOS icon grid: the tile occupies ~824/1024 of the canvas
	     with transparent margin, per the Big Sur+ icon template. Keep the two
	     files in sync if the mark changes. -->
	<g transform="translate(100 100) scale(25.75)">
		<defs>
			<linearGradient id="flame" x1="16" y1="30" x2="16" y2="2" gradientUnits="userSpaceOnUse">
				<stop stop-color="#e8531f" />
				<stop offset="0.55" stop-color="#ffab3d" />
				<stop offset="1" stop-color="#ffe14d" />
			</linearGradient>
		</defs>
		<rect width="32" height="32" rx="7.2" fill="#17151a" />
		<!-- flames wrapping the sides + lower background -->
		<path
			d="M6 27 C2 22 3 15 5 11 C5.5 14 6.5 15 8 15.5 C7 12 8 8 11 5.5 C10.5 9 12 11 13.5 11.5 C13 7 14.5 3.5 16 2 C17.5 3.5 19 7 18.5 11.5 C20 11 21.5 9 21 5.5 C24 8 25 12 24 15.5 C25.5 15 26.5 14 27 11 C29 15 30 22 26 27 Z"
			fill="url(#flame)"
		/>
		<!-- clock in the foreground -->
		<circle cx="16" cy="17.5" r="8.4" fill="#17151a" stroke="#f0ebe2" stroke-width="1.5" />
		<g stroke="#f0ebe2" stroke-width="1.4" stroke-linecap="round">
			<line x1="16" y1="10.4" x2="16" y2="11.8" />
			<line x1="16" y1="23.2" x2="16" y2="24.6" />
			<line x1="9.4" y1="17.5" x2="10.8" y2="17.5" />
			<line x1="21.2" y1="17.5" x2="22.6" y2="17.5" />
		</g>
		<g stroke="#f0ebe2" stroke-linecap="round">
			<line x1="16" y1="17.5" x2="19.4" y2="14.6" stroke-width="1.6" />
			<line x1="16" y1="17.5" x2="12" y2="14.4" stroke-width="1.3" />
		</g>
		<circle cx="16" cy="17.5" r="1.4" fill="#ffab3d" />
	</g>
</svg>
