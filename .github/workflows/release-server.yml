# Server artifacts off release tags (#75): image + Helm chart → GHCR.
#
# Runs on the public mirror: gitea.zen.lofi push-mirrors here, and a mirrored
# tag push is a normal PAT-authenticated push, so it triggers this workflow.
# NB the mirror's PAT needs the `workflow` scope once this file exists, or
# gitea's syncs get refused by GitHub.
#
# GHCR auth is the workflow's own GITHUB_TOKEN (packages: write below) — no
# extra secrets. The image is a multi-arch manifest (amd64 + arm64; the arm
# leg builds under QEMU — slow but correct for a small Go binary).
#
# What this deliberately does NOT cover:
#   - the internal gitea registry (#48): unreachable from GitHub runners;
#     that push stays with scripts/release-server.sh (`just release-server`),
#     which is also the by-hand fallback for everything here
#   - the app release: Mac-bound signing/notarization, scripts/release.sh
#   - first-push package visibility: GHCR creates packages private and has
#     no API to change that — flip primetime-server and
#     charts/primetime-server to public once in the web UI
name: release-server

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sf1tzp/primetime-server:${{ github.ref_name }}
            ghcr.io/sf1tzp/primetime-server:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Lockstep stamping from the tag, same rule as release-server.sh:
      # chart version = appVersion = ${TAG#v}; Chart.yaml is a placeholder.
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin \
              <<< "${{ secrets.GITHUB_TOKEN }}"
          helm package infra/helm/primetime-server \
              --version "$VERSION" --app-version "$VERSION" -d dist
          helm push "dist/primetime-server-$VERSION.tgz" oci://ghcr.io/sf1tzp/charts
