# PrimeTime v1 GraphQL schema.
#
# Vocabulary (see gitea issue #27): a *label* is a key: value dimension
# attached to a timespan; *label definitions* register a key with its display
# colours; *label sets* are reusable, launchable label combinations.
# The wire contract is PrimeTime's own from v1 on — it is not
# traggo-compatible, although much of the implementation derives from traggo.

enum Role {
    ADMIN
    USER
}
directive @hasRole(role: Role!) on FIELD_DEFINITION

schema {
    query: RootQuery
    mutation: RootMutation
}

type RootMutation {
    createLabelDefinition(key: String!, color: String!): LabelDefinition @hasRole(role: USER)
    updateLabelDefinition(key: String!, newKey: String, color: String!): LabelDefinition @hasRole(role: USER)
    removeLabelDefinition(key: String!): LabelDefinition @hasRole(role: USER)

    setLabelValueColor(key: String!, value: String!, color: String!): LabelDefinition @hasRole(role: USER)
    clearLabelValueColor(key: String!, value: String!): LabelDefinition @hasRole(role: USER)

    createLabelSet(name: String!, symbolName: String!, labels: [InputLabel!]!): LabelSet @hasRole(role: USER)
    updateLabelSet(id: Int!, name: String!, symbolName: String!, labels: [InputLabel!]!): LabelSet @hasRole(role: USER)
    moveLabelSet(id: Int!, position: Int!): [LabelSet!] @hasRole(role: USER)
    removeLabelSet(id: Int!): LabelSet @hasRole(role: USER)

    createUser(name: String!, pass: String!, admin: Boolean!): User @hasRole(role: ADMIN)
    removeUser(id: Int!): User @hasRole(role: ADMIN)
    updateUser(id: Int!, name: String!, pass: String, admin: Boolean!): User @hasRole(role: ADMIN)

    login(username: String!, pass: String!, deviceName: String!, type: DeviceType!, cookie: Boolean!): Login

    createDevice(name: String!, type: DeviceType!): Login @hasRole(role: USER)
    updateDevice(id: Int!, name: String!, type: DeviceType!): Device @hasRole(role: USER)
    removeDevice(id: Int!): Device @hasRole(role: USER)
    removeCurrentDevice: Device! @hasRole(role: USER)

    createTimeSpan(start: Time!, end: Time, labels: [InputLabel!], note: String!): TimeSpan @hasRole(role: USER)
    updateTimeSpan(id: Int!, start: Time!, end: Time, labels: [InputLabel!], oldStart: Time, note: String!): TimeSpan @hasRole(role: USER)
    removeTimeSpan(id: Int!): TimeSpan @hasRole(role: USER)
    replaceTimeSpanLabels(from: InputLabel!, to: InputLabel!, opt: InputReplaceOptions!): Boolean @hasRole(role: USER)
    copyTimeSpan(id: Int!, start: Time!, end: Time): TimeSpan @hasRole(role: USER)
    stopTimeSpan(id: Int!, end: Time!): TimeSpan @hasRole(role: USER)

    setUserPreferences(preferences: InputUserPreferences!): UserPreferences! @hasRole(role: USER)
}

type RootQuery {
    suggestLabelKey(query: String!): [LabelDefinition!] @hasRole(role: USER)
    suggestLabelValue(key: String!, query: String!): [String!] @hasRole(role: USER)
    labelDefinitions: [LabelDefinition!] @hasRole(role: USER)
    labelSets: [LabelSet!] @hasRole(role: USER)
    users: [User!] @hasRole(role: ADMIN)
    currentUser: User
    currentDevice: Device
    devices: [Device!] @hasRole(role: USER)
    timeSpans(fromInclusive: Time, toInclusive: Time, cursor: InputCursor): PagedTimeSpans! @hasRole(role: USER)
    timers: [TimeSpan!] @hasRole(role: USER)
    stats(ranges: [Range!], keys: [String!], excludeLabels: [InputLabel!], requireLabels: [InputLabel!]): [RangedStatisticsEntries!] @hasRole(role: USER)
    stats2(now: Time!, stats: InputStatsSelection!): [RangedStatisticsEntries!] @hasRole(role: USER)
    version: Version!
    userPreferences: UserPreferences! @hasRole(role: USER)
}

# Per-user preferences a second device should inherit. Colouring *data* (key
# and value colours) already syncs via LabelDefinition; these are the
# remaining bits of per-user client state. Fresh-user defaults:
# colorByValue = true, menuLabelSetLimit = 5.
type UserPreferences {
    # Colour timespans by label value — PrimeTime's default behaviour (key
    # colours remain for navigating Label Review).
    colorByValue: Boolean!
    # How many label sets the menu shows (0 = all).
    menuLabelSetLimit: Int!
}

input InputUserPreferences {
    colorByValue: Boolean!
    menuLabelSetLimit: Int!
}

input InputReplaceOptions {
    override: OverrideMode!
}

enum OverrideMode {
    Override, Discard
}

input InputCursor {
    offset: Int
    startId: Int
    pageSize: Int
}

type Cursor {
    hasMore: Boolean!
    offset: Int!
    startId: Int!
    pageSize: Int!
}

type Version {
    name: String!
    commit: String!
    buildDate: String!
}

type Login {
    token: String!
    user: User!
    device: Device!
}

type Device {
    id: Int!
    name: String!
    type: DeviceType!
    createdAt: Time!
    activeAt: Time!
}

enum DeviceType {
    LongExpiry, ShortExpiry, NoExpiry
}

scalar Time

# A label key's definition: the key colour plus any per-value colour
# overrides, scoped to the current user.
type LabelDefinition {
    key: String!
    color: String!
    valueColors: [LabelValueColor!]!
    usages: Int!
}

# A colour override for one value of a label key.
type LabelValueColor {
    value: String!
    color: String!
}

# A named, ordered, launchable combination of labels with an SF Symbol icon.
# The list order of `labelSets` is the user's chosen order.
type LabelSet {
    id: Int!
    name: String!
    symbolName: String!
    labels: [Label!]!
}

type User {
    admin: Boolean!
    id: Int!
    name: String!
}

type TimeSpan {
    id: Int!
    start: Time!
    end: Time
    oldStart: Time
    labels: [Label!]
    note: String!
}

type PagedTimeSpans {
    timeSpans: [TimeSpan!]!
    cursor: Cursor!
}

# A key: value dimension attached to a timespan.
type Label {
    key: String!
    value: String!
}

input InputLabel {
    key: String!
    value: String!
}

input Range {
    start: Time!
    end: Time!
}

type StatisticsEntry {
    key: String!
    value: String!
    timeSpendInSeconds: Float!
}

type RangedStatisticsEntries {
    start: Time!
    end: Time!
    entries: [StatisticsEntry!]
}

input InputStatsSelection {
    interval: StatsInterval!
    keys: [String!]
    excludeLabels: [InputLabel!]
    includeLabels: [InputLabel!]
    range: InputRelativeOrStaticRange!
}

enum StatsInterval {
    Hourly, Daily, Weekly, Monthly, Yearly, Single
}

# A date range whose ends are either static timestamps or relative
# expressions like "now-1d/d" (see time.ParseRange).
input InputRelativeOrStaticRange {
    from: String!
    to: String!
}
