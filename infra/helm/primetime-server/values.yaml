# Default values for primetime-server.

image:
  repository: gitea.zen.lofi/sfi/primetime-server
  # Defaults to "v<Chart.AppVersion>" when empty (see _helpers.tpl).
  tag: ""
  pullPolicy: IfNotPresent

# Pull secret(s) for a private registry. Create one with:
#   kubectl create secret docker-registry gitea-registry \
#     --docker-server=gitea.zen.lofi --docker-username=<user> --docker-password=<token>
# then set: imagePullSecrets: [{name: gitea-registry}]
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# SQLite is the only supported dialect, so exactly one writer: the workload is
# a single replica with Recreate strategy (never two pods on one DB file).
replicaCount: 1

# Server configuration (TRAGGO_* env). logLevel: debug|info|warn|error|fatal|panic.
config:
  logLevel: info
  passStrength: 10
  # DB file, relative to the /opt/primetime workdir; lives on the PVC mount.
  databaseConnection: data/primetime.db

# First-run admin user. Seeded only against an empty database. CHANGE THE
# PASSWORD before exposing the server. Set existingSecret to source
# TRAGGO_DEFAULT_USER_NAME / TRAGGO_DEFAULT_USER_PASS from your own Secret
# (keys: username, password) instead of the values below.
admin:
  username: admin
  password: admin
  existingSecret: ""

persistence:
  enabled: true
  # Empty = cluster default StorageClass. On k3s that is local-path.
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  # Bind an existing PVC instead of creating one.
  existingClaim: ""

service:
  type: ClusterIP
  port: 3030

ingress:
  enabled: false
  className: traefik
  annotations: {}
  host: primetime.local
  # Path prefix the server is served under.
  path: /
  pathType: Prefix
  tls: []
  # - secretName: primetime-tls
  #   hosts: [primetime.example.com]

# Pod runs the static binary as a non-root user; fsGroup makes the PVC
# writable to it. The scratch image has no shell, so keep it minimal.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 256Mi
  # requests:
  #   cpu: 50m
  #   memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
