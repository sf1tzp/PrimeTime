apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moment-tally-server.fullname" . }}
  labels:
    {{- include "moment-tally-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # SQLite is a single writer sharing one PVC — never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "moment-tally-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when the admin credentials change.
        checksum/admin-secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "moment-tally-server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: moment-tally-server
          image: "{{ .Values.image.repository }}:{{ include "moment-tally-server.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3030
              protocol: TCP
          env:
            - name: MOMENTTALLY_PORT
              value: "3030"
            - name: MOMENTTALLY_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: MOMENTTALLY_PASS_STRENGTH
              value: {{ .Values.config.passStrength | quote }}
            - name: MOMENTTALLY_DATABASE_DIALECT
              value: sqlite3
            - name: MOMENTTALLY_DATABASE_CONNECTION
              value: {{ .Values.config.databaseConnection | quote }}
            - name: MOMENTTALLY_DEFAULT_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "moment-tally-server.adminSecretName" . }}
                  key: username
            - name: MOMENTTALLY_DEFAULT_USER_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "moment-tally-server.adminSecretName" . }}
                  key: password
          # No dedicated health endpoint; a listening socket means ready.
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /opt/moment-tally/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "moment-tally-server.pvcName" . }}
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
